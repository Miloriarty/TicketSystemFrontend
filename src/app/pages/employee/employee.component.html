<main class="content">
  <section class="tickets">
    <div class="tickets-toolbar">
      <div class="tickets-toolbar-left">
        <div class="section-title">
          <h2>All tickets</h2>
          <span>{{ visibleTickets().length }}</span>
        </div>

        <mat-chip-listbox [(ngModel)]="selectedStatusFilter">
          <mat-chip-option [value]="TicketStatus.New">New</mat-chip-option>
          <mat-chip-option [value]="TicketStatus.InProgress">In progress</mat-chip-option>
        </mat-chip-listbox>
      </div>

      <button matButton="outlined" (click)="toggleSort()">
        <mat-icon>{{ sortDirection() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
        {{ sortDirection() === 'asc' ? 'Oldest first' : 'Newest first' }}
      </button>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          [ngModel]="searchTicket()"
          (ngModelChange)="searchTicket.set($event)"
          placeholder="Search tickets"
        />
      </mat-form-field>
    </div>

    <div class="tickets-grid">
      @for (ticket of visibleTickets(); track ticket.id) {
        <app-employee-card
          [ticket]="ticket"
          [categories]="categories()"
          (closeTicket)="closeTicket($event.ticket, $event.status)"
          (changeStatus)="changeStatus($event.ticket, $event.status)"
        />
      } @empty {
        <div class="tickets-empty">
          <mat-icon>inbox</mat-icon>
          <div>No assigned tickets</div>
        </div>
      }
    </div>
  </section>
</main>
