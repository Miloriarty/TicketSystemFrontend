<!-- Content -->
<main class="content">
  <!-- Employee create card -->
  <app-employee-create-card
    [categories]="categories()"
    [editingEmployeeId]="editingEmployeeId()"
    [(fullName)]="fullName"
    [(position)]="position"
    [(password)]="password"
    [(selectedRole)]="selectedRole"
    [(selectedCategories)]="selectedCategories"
    (save)="createEmployee()"
    (cancel)="clearEmployeeForm()"
  />

  <!--  Categories Card  -->
  <app-categories-card
    [categories]="categories()"
    [(newCategory)]="newCategoryName"
    (create)="createCategory($event)"
    (delete)="deleteCategory($event)"
  />

  <!-- All employees -->
  <section class="all-employee">
    <div class="tickets-toolbar">
      <div>
        <div class="section-title">
          <h2>All employees</h2>
          <span>{{ visibleEmployees().length }}</span>
        </div>

        <mat-chip-listbox [(ngModel)]="selectedRoleFilter">
          @for (role of roles; track role) {
            <mat-chip-option [value]="role">{{ role }}</mat-chip-option>
          }
        </mat-chip-listbox>
      </div>

      <div class="toolbar-fields">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
          <mat-select
            multiple
            placeholder="Categories"
            [ngModel]="selectedCategoriesFilter()"
            (ngModelChange)="selectedCategoriesFilter.set($event)"
          >
            @for (category of categories(); track category.id) {
              <mat-option [value]="category.id">{{ category.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
          <mat-icon matPrefix>search</mat-icon>
          <input
            matInput
            [ngModel]="searchEmployee()"
            (ngModelChange)="searchEmployee.set($event)"
            placeholder="Search employees"
          />
        </mat-form-field>
      </div>
    </div>

    <div class="employee-grid">
      @for (employee of visibleEmployees(); track employee.id) {
        <app-employee-card
          [employee]="employee"
          [categories]="categories()"
          [myId]="myId"
          (edit)="editEmployee($event)"
          (delete)="deleteEmployee($event)"
        />
      } @empty {
        <div class="employees-empty">No employees found</div>
      }
    </div>
  </section>
</main>
