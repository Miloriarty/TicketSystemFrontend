<mat-card class="ticket-card">
  <div class="ticket-top">
    <div class="ticket-info">
      <span class="ticket-number">Ticket #{{ ticket().id }}</span>
      <h3>{{ ticket().title }}</h3>
    </div>

    <div class="status" [ngClass]="statusClass[ticket().status]">
      {{ ticket().status }}
    </div>

    <div class="ticket-actions">
      <button mat-icon-button (click)="edit.emit(ticket())">
        <mat-icon>edit</mat-icon>
      </button>

      @if (canDelete()) {
        <button mat-icon-button class="delete-button" (click)="delete.emit(ticket().id)">
          <mat-icon>delete</mat-icon>
        </button>
      }

      @if (canReopen()) {
        <button mat-icon-button class="delete-button" (click)="reopen.emit(ticket())">
          <mat-icon>restart_alt</mat-icon>
        </button>
      }
    </div>
  </div>
  <span class="ticket-description">{{ ticket().description }}</span>

  <div class="ticket-bottom">
    <span>
      <mat-icon>schedule</mat-icon>
      {{ ticket().createdAt | date: 'dd.MM.yy, HH.mm' }}
    </span>
    <span>
      <mat-icon>person</mat-icon>
      {{ (ticket().employeeIds | namesByIds: employees() : 'fullName').join(', ') }}
    </span>
  </div>
</mat-card>
