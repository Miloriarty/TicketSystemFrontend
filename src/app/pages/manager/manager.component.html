<!-- Content -->
<main class="content">
  <!-- Create card -->
  <app-create-ticket-card
    [employees]="employees()"
    [categories]="categories()"
    [editingTicketId]="editingTicketId()"
    [(title)]="title"
    [(description)]="description"
    [(selectedCategories)]="selectedCategories"
    [(selectedEmployees)]="selectedEmployees"
    (save)="saveTicket()"
    (cancel)="clearForm()"
  />

  <!-- Right section -->
  <section class="tickets">
    <div class="section-title">
      <h2>Recent tickets</h2>
    </div>
    @for (ticket of sortedTickets().slice(0, 3); track ticket.id) {
      <app-ticket-card
        [ticket]="ticket"
        [employees]="employees()"
        (edit)="editTicket($event)"
        (delete)="deleteTicket($event)"
        (reopen)="reopenTicket($event)"
      />
    }
  </section>

  <!-- Bottom section -->
  <section class="all-tickets">
    <div class="tickets-toolbar">
      <div>
        <div class="section-title">
          <h2>Overall tickets: {{ visibleTickets().length }}</h2>
        </div>

        <mat-chip-listbox [(ngModel)]="selectedStatusFilter">
          @for (status of statuses; track status) {
            <mat-chip-option [value]="status">{{ status }}</mat-chip-option>
          }
        </mat-chip-listbox>
      </div>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          [ngModel]="searchTicket()"
          (ngModelChange)="searchTicket.set($event)"
          placeholder="Search tickets"
        />
      </mat-form-field>
    </div>

    <div class="tickets-grid">
      @for (ticket of visibleTickets(); track ticket.id) {
        <app-ticket-card
          [ticket]="ticket"
          [employees]="employees()"
          (edit)="editTicket($event)"
          (delete)="deleteTicket($event)"
          (reopen)="reopenTicket($event)"
        />
      }
    </div>
  </section>
</main>
